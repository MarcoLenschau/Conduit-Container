services:
  frontend:
    image: ghcr.io/marcolenschau/conduit-container/frontend:latest
    restart: on-failure
    ports: 
      - "8282:80"
    depends_on:
      - backend
  backend:
    image: ghcr.io/marcolenschau/conduit-container/backend:latest
    restart: on-failure
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - database
  database:
    image: postgres:18.1
    hostname: postgres
    restart: on-failure
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:  