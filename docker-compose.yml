services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      args:
        - BACKEND_URL=${BACKEND_URL}
    ports: 
      - "4000:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./
      dockerfile: Dockerfile.backend
      args:
        - ALLOWED_HOST=${ALLOWED_HOST}
        - CORS_ORIGIN=${CORS_ORIGIN}
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app
volumes:
  backend-data: