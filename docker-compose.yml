services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
      args:
        - BACKEND_URL=${BACKEND_URL}
    ports: 
      - "4000:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app
volumes:
  backend-data: