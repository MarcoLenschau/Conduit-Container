name: Deployment
on: 
  push:
    branches:
      - main
      - auto-deploment
  pull_request:
    branches:
      - main
      - auto-deploment
      
jobs:
  deployment:
    runs-on: ubuntu-24.04
    name: Deploy
    steps: 
      - uses: actions/checkout@v6.0.2
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.USERNAME }}/"
          script: |
            docker-compose up -d --build 